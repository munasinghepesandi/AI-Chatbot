<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-1: #020617;
            --bg-2: #0f172a;
            --ink: #e2e8f0;
            --muted: #94a3b8;
            --card: rgba(15, 23, 42, 0.7);
            --stroke: rgba(148, 163, 184, 0.24);
            --accent: #0ea5e9;
            --accent-2: #f97316;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--ink);
            background: radial-gradient(1200px 500px at -15% -10%, #0ea5e92b 0%, transparent 60%),
                        radial-gradient(900px 600px at 110% 5%, #f9731620 0%, transparent 62%),
                        linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .title-font {
            font-family: 'Sora', sans-serif;
        }

        .glass {
            background: var(--card);
            border: 1px solid var(--stroke);
            backdrop-filter: blur(14px);
        }

        .noise::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(148, 163, 184, 0.07) 0.5px, transparent 0.5px);
            background-size: 3px 3px;
            pointer-events: none;
        }

        .float-soft {
            animation: floatSoft 6s ease-in-out infinite;
        }

        .fade-up {
            animation: fadeUp 0.55s ease;
        }

        @keyframes floatSoft {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0px); }
        }

        #messagesContainer::-webkit-scrollbar,
        #chatHistory::-webkit-scrollbar {
            width: 8px;
        }

        #messagesContainer::-webkit-scrollbar-thumb,
        #chatHistory::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 999px;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="relative min-h-screen noise">
        <div class="pointer-events-none absolute left-8 top-8 h-20 w-20 rounded-full bg-orange-500/20 blur-2xl float-soft"></div>
        <div class="pointer-events-none absolute right-10 top-24 h-28 w-28 rounded-full bg-cyan-400/20 blur-2xl float-soft"></div>

        <div class="mx-auto grid h-screen max-w-7xl grid-cols-1 gap-4 p-3 sm:gap-5 sm:p-5 lg:grid-cols-[300px_1fr] lg:p-6">
        <!-- Sidebar -->
        <aside class="glass fade-up flex min-h-0 flex-col overflow-hidden rounded-2xl shadow-[0_20px_60px_-24px_rgba(2,6,23,0.8)]">
            <div class="border-b border-slate-700/70 p-4">
                <button id="newChatBtn" class="w-full rounded-xl bg-gradient-to-r from-sky-500 to-cyan-500 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-sky-500/30 transition hover:scale-[1.01] hover:from-sky-600 hover:to-cyan-600">
                    <span>+ New Chat</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto px-4 py-3">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Recent</p>
                <div id="chatHistory" class="space-y-2 pr-1">
                    <!-- Chat history items will be added here -->
                </div>
            </div>
            <div class="border-t border-slate-700/70 p-4">
                <div class="mb-3">
                    <label for="modelSelect" class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-400">Model</label>
                    <select
                        id="modelSelect"
                        class="w-full rounded-xl border border-slate-700 bg-slate-900/90 px-3 py-2 text-sm text-slate-100 shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-400"
                    >
                        <option value="stepfun/step-3.5-flash:free">stepfun/step-3.5-flash:free</option>
                        <option value="meta-llama/llama-3.2-11b-vision-instruct:free">meta-llama/llama-3.2-11b-vision-instruct:free</option>
                        <option value="nvidia/nemotron-nano-12b-v2-vl:free">nvidia/nemotron-nano-12b-v2-vl:free</option>
                        <option value="mistralai/mistral-small-3.1-24b-instruct:free">mistralai/mistral-small-3.1-24b-instruct:free</option>
                        <option value="google/gemma-3-27b-it:free">google/gemma-3-27b-it:free</option>
                        <option value="google/gemma-3-4b-it:free">google/gemma-3-4b-it:free</option>
                        <option value="google/gemma-3-12b-it:free">google/gemma-3-12b-it:free</option>
                        <option value="nividia/nemotron-3-super-120b-a12b:free">nividia/nemotron-3-super-120b-a12b:free</option>
                        <option value="arcee-ai/trinity-large-preview:free">arcee-ai/trinity-large-preview:free</option>
                        <option value="meta-llama/llama-3.3-70b-instruct:free">meta-llama/llama-3.3-70b-instruct:free</option>
                        <option value="deepseek/deepseek-chat-v3-0324:free">deepseek/deepseek-chat-v3-0324:free</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <input 
                        type="password" 
                        id="apiKeyInput" 
                        placeholder="Enter OpenRouter API Key" 
                        class="flex-1 rounded-xl border border-slate-700 bg-slate-900/90 px-3 py-2 text-sm text-slate-100 shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-400"
                    >
                    <button 
                        id="saveApiKeyBtn" 
                        class="rounded-xl bg-cyan-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-cyan-500"
                    >
                        Save
                    </button>
                </div>
                <p class="mt-2 text-xs text-slate-400">Get your key from <a href="https://openrouter.ai" target="_blank" class="font-medium text-cyan-400 underline">openrouter.ai</a></p>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="glass fade-up flex min-h-0 flex-col overflow-hidden rounded-2xl shadow-[0_20px_60px_-24px_rgba(2,6,23,0.8)]">
            <!-- Header -->
            <div class="flex h-16 items-center justify-between border-b border-slate-700/70 px-4 sm:px-6">
                <h1 class="title-font text-lg font-bold sm:text-xl">Nova Chat</h1>
                <span class="rounded-full border border-cyan-500/30 bg-cyan-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-cyan-300">OpenRouter</span>
            </div>

            <!-- Messages Container -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                <div class="flex justify-center items-center h-full">
                    <div class="text-center text-slate-300">
                        <h2 class="title-font mb-2 text-2xl font-bold sm:text-3xl">How can I help you today?</h2>
                        <p class="text-sm sm:text-base text-slate-400">Upload images, switch models, and chat naturally.</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="border-t border-slate-700/70 p-3 sm:p-4 flex flex-col gap-3 bg-slate-900/60">
                <div id="imagePreviewContainer" class="hidden">
                    <div class="inline-flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-900 px-2 py-2 shadow-sm">
                        <img id="imagePreview" src="" alt="Selected upload" class="w-12 h-12 object-cover rounded">
                        <span id="imageName" class="max-w-40 truncate text-xs text-slate-300 sm:max-w-56"></span>
                        <button id="removeImageBtn" class="rounded-lg bg-red-500 px-2 py-1 text-xs font-semibold text-white transition hover:bg-red-600">Remove</button>
                    </div>
                </div>
                <div class="flex gap-3">
                    <input id="imageInput" type="file" accept="image/*" class="hidden">
                    <button 
                        id="uploadImageBtn" 
                        class="rounded-xl border border-slate-700 bg-slate-900 px-3 py-3 text-sm font-semibold text-slate-200 transition hover:border-slate-600 hover:bg-slate-800"
                        title="Upload image"
                        type="button"
                    >
                        Image
                    </button>
                    <textarea 
                        id="userInput" 
                        placeholder="Send a message..." 
                        class="flex-1 resize-none rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm text-slate-100 shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-400"
                        rows="2"
                    ></textarea>
                    <button 
                        id="sendBtn" 
                        class="min-w-16 flex items-center justify-center rounded-xl bg-gradient-to-r from-cyan-500 to-sky-500 px-5 py-3 text-white shadow-lg shadow-cyan-500/30 transition hover:scale-[1.01] hover:from-cyan-400 hover:to-sky-400"
                        title="Send message (Ctrl+Enter)"
                    >
                        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10h12"></path>
                            <path d="M11 6l4 4-4 4"></path>
                        </svg>
                    </button>
                </div>
                <p class="text-center text-xs text-slate-400">Press Ctrl+Enter to send</p>
            </div>
        </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
